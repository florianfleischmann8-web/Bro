          # Anti-Tracking / Anti-Fingerprint Skript (vor jeder Seite)
          cat > app/src/main/assets/harden.js <<'EOF'
          (function(){
            function def(o,p,v){try{Object.defineProperty(o,p,{get:function(){return v},configurable:true});}catch(e){}}
            ['RTCPeerConnection','webkitRTCPeerConnection','RTCDataChannel','RTCIceCandidate','RTCSessionDescription'].forEach(function(n){
              try{delete window[n];}catch(e){}
              def(window,n,undefined);
            });
            def(navigator,'mediaDevices',undefined);
            def(navigator,'getBattery',undefined);
            def(navigator,'connection',undefined);
            def(navigator,'hardwareConcurrency',4);
            def(navigator,'deviceMemory',4);
            def(navigator,'language','en-US');
            def(navigator,'languages',['en-US','en']);
            def(navigator,'platform','Linux armv81');
            def(navigator,'doNotTrack','1');
            try{
              var o=HTMLCanvasElement.prototype.toDataURL;
              HTMLCanvasElement.prototype.toDataURL=function(){
                try{var c=this.getContext('2d');
                  if(c&&this.width>0&&this.height>0){var d=c.getImageData(0,0,1,1);d.data[0]^=1;c.putImageData(d,0,0);}
                }catch(e){}
                return o.apply(this,arguments);
              };
              var g=CanvasRenderingContext2D.prototype.getImageData;
              CanvasRenderingContext2D.prototype.getImageData=function(){
                var r=g.apply(this,arguments);
                try{if(r&&r.data&&r.data.length>3){r.data[0]^=1;}}catch(e){}
                return r;
              };
            }catch(e){}
          })();
          EOF

