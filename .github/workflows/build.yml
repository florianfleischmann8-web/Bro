              <path android:fillColor="#3A3F47"
                  android:pathData="M16,8h64a8,8 0 0 1 8,8v64a8,8 0 0 1 -8,8H16a8,8 0 0 1 -8,-8V16a8,8 0 0 1 8,-8z"/>
              <path android:fillColor="#9FD3C7" android:pathData="M20,20h56v16H20z"/>
