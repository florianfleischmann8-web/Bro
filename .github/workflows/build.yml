              // ---------- WebView ----------

              private void setupWebView() {
                  WebView.setWebContentsDebuggingEnabled(false);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  s.setSaveFormData(false);
                  s.setGeolocationEnabled(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setSupportMultipleWindows(false);
                  s.setMediaPlaybackRequiresUserGesture(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setTextZoom(100);
                  if (Build.VERSION.SDK_INT >= 26) {
                      s.setSafeBrowsingEnabled(false); // keine Anfragen an Google
                      web.setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_NO_EXCLUDE_DESCENDANTS);
                  }

                  // Neutraler Chrome-Android-User-Agent (gleiche Engine, daher keine Diskrepanz)
                  String ua = s.getUserAgentString()
                          .replaceAll("\\(Linux; Android [^)]*\\)", "(Linux; Android 10; K)")
                          .replaceAll("Chrome/(\\d+)\\.[\\d.]+", "Chrome/$1.0.0.0")
                          .replace(" Version/4.0", "");
                  s.setUserAgentString(ua);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, false);

                  final String hardenJs = asset("harden.js");
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      WebViewCompat.addDocumentStartJavaScript(web, hardenJs, Collections.singleton("*"));
                  }

                  web.setDownloadListener((url, a, c, m, l) ->
                          Toast.makeText(this, "Downloads sind blockiert", Toast.LENGTH_SHORT).show());

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView v, int p) {
                          pb.setProgress(p);
                          pb.setVisibility(p >= 100 ? View.INVISIBLE : View.VISIBLE);
                      }
                      @Override public void onPermissionRequest(PermissionRequest r) { r.deny(); }
                      @Override public void onGeolocationPermissionsShowPrompt(String o,
                              GeolocationPermissions.Callback cb) { cb.invoke(o, false, false); }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView v, String u, android.graphics.Bitmap f) {
                          if (!WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                              v.evaluateJavascript(hardenJs, null);
                          }
                      }
                      @Override
                      public void onPageFinished(WebView v, String u) {
                          if (clearAfter) { v.clearHistory(); clearAfter = false; }
                          if (u == null || u.startsWith("about:") || u.startsWith("data:")) bar.setText("");
                          else if (!bar.hasFocus()) bar.setText(u);
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String sch = u.getScheme();
                          if ("https".equals(sch) || "about".equals(sch) || "data".equals(sch)) return false;
                          if ("http".equals(sch)) {
                              if (isOnion(u.getHost())) return false;
                              v.loadUrl(u.buildUpon().scheme("https").build().toString()); // HTTPS-Upgrade
                              return true;
                          }
                          return true; // intent:, market:, tel: ... alles blocken
                      }
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String sch = u.getScheme();
                          if ("https".equals(sch) || "about".equals(sch) || "data".equals(sch)
                                  || "blob".equals(sch)) return null;
                          if ("http".equals(sch) && isOnion(u.getHost())) return null;
                          return new WebResourceResponse("text/plain", "utf-8",
                                  new ByteArrayInputStream(new byte[0]));
                      }
                  });
              }

              private boolean isOnion(String host) {
                  return host != null && host.endsWith(".onion");
              }

              private String asset(String name) {
                  try (InputStream in = getAssets().open(name)) {
                      ByteArrayOutputStream o = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int r;
                      while ((r = in.read(buf)) > 0) o.write(buf, 0, r);
                      return o.toString("UTF-8");
                  } catch (Exception e) {
                      return "";
                  }
              }

              // ---------- Tor ----------

              /** Startet das in die App eingebaute Tor und setzt danach den Proxy (fail-closed). */
              private void startTor() {
                  torDot.setTextColor(Color.parseColor("#FFB020"));
                  Toast.makeText(this, "Tor wird gestartet - das kann beim ersten Mal ca. 1 Minute dauern",
                          Toast.LENGTH_LONG).show();
                  final Object[] svc = new Object[1];
                  torConn = new ServiceConnection() {
                      @Override public void onServiceConnected(ComponentName n, IBinder binder) {
                          try {
                              svc[0] = binder.getClass().getMethod("getService").invoke(binder);
                          } catch (Exception e) {
                              svc[0] = null;
                          }
                      }
                      @Override public void onServiceDisconnected(ComponentName n) { svc[0] = null; }
                  };
                  try {
                      Intent i = new Intent().setClassName(this, "org.torproject.jni.TorService");
                      bindService(i, torConn, BIND_AUTO_CREATE);
                  } catch (Exception e) {
                      // faellt unten auf Orbot (Port 9050/9150) zurueck
                  }
                  new Thread(() -> {
                      int found = 0;
                      for (int t = 0; t < 150 && found == 0; t++) {
                          int cand = 0;
                          try {
                              if (svc[0] != null) {
                                  Object r = svc[0].getClass().getMethod("getSocksPort").invoke(svc[0]);
                                  if (r instanceof Integer) cand = (Integer) r;
                              }
                          } catch (Exception e) { cand = 0; }
                          if (cand > 0 && portOpen(cand)) found = cand;
                          else if (t >= 45) {
                              if (portOpen(9050)) found = 9050;
                              else if (portOpen(9150)) found = 9150;
                          }
                          if (found == 0) {
                              try { Thread.sleep(1000); } catch (InterruptedException e) { return; }
                          }
                      }
                      final int port = found;
                      runOnUiThread(() -> {
                          if (port == 0) {
                              torDot.setTextColor(BAD);
                              Toast.makeText(this, "Tor konnte nicht gestartet werden - Browser bleibt gesperrt",
                                      Toast.LENGTH_LONG).show();
                              return;
                          }
                          socksPort = port;
                          torOk = true;
                          torDot.setTextColor(OK);
                          applyProxy(port);
                      });
                  }).start();
              }

              private boolean portOpen(int port) {
                  try (Socket sk = new Socket()) {
                      sk.connect(new InetSocketAddress("127.0.0.1", port), 800);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void applyProxy(int port) {
                  if (!WebViewFeature.isFeatureSupported(WebViewFeature.PROXY_OVERRIDE)) {
                      Toast.makeText(this, "WebView unterstuetzt keinen Proxy - Browser gesperrt",
                              Toast.LENGTH_LONG).show();
                      return;
                  }
                  ProxyConfig cfg = new ProxyConfig.Builder()
                          .addProxyRule("socks5://127.0.0.1:" + port).build();
                  ProxyController.getInstance().setProxyOverride(cfg, Runnable::run, () ->
                          runOnUiThread(() -> {
                              proxyReady = true;
                              if (!locked) home();
                          }));
              }

              private void checkTor() {
                  if (socksPort == 0) return;
                  final int port = socksPort;
                  new Thread(() -> {
                      final boolean r = portOpen(port);
                      runOnUiThread(() -> {
                          torOk = r;
                          torDot.setTextColor(r ? OK : BAD);
                      });
                  }).start();
              }

              // ---------- Navigation ----------

              private void home() {
                  if (!proxyReady) return;
                  checkTor();
                  clearAfter = true;
                  web.loadDataWithBaseURL("about:blank", asset("start.html"),
                          "text/html", "utf-8", null);
              }

              private void go(String in) {
                  if (in.isEmpty()) return;
                  if (!proxyReady) return;
                  if (!torOk) {
                      Toast.makeText(this, "Tor startet noch oder ist nicht erreichbar",
                              Toast.LENGTH_LONG).show();
                      checkTor();
                      return;
                  }
                  String url;
                  if (in.matches("(?i)^https?://\\S+$")) {
                      url = in;
                  } else if (in.matches("(?i)^[^\\s/]+\\.[^\\s/]+(/\\S*)?$")) {
                      String host = in.split("/")[0];
                      url = (isOnion(host) ? "http://" : "https://") + in;
                  } else {
                      try {
                          url = SEARCH + "?q=" + URLEncoder.encode(in, "UTF-8");
                      } catch (Exception e) {
                          return;
                      }
                  }
                  Uri u = Uri.parse(url);
                  if ("http".equals(u.getScheme()) && !isOnion(u.getHost())) {
                      url = u.buildUpon().scheme("https").build().toString();
                  }
                  bar.clearFocus();
                  web.loadUrl(url);
              }

              // ---------- Datenschutz ----------

              private void wipe() {
                  CookieManager.getInstance().removeAllCookies(null);
                  CookieManager.getInstance().flush();
                  WebStorage.getInstance().deleteAllData();
                  web.clearCache(true);
                  web.clearHistory();
                  web.clearFormData();
                  web.clearSslPreferences();
                  WebView.clearClientCertPreferences(null);
              }

              private void newIdentity() {
                  wipe();
                  home();
                  Toast.makeText(this, "Alles gelöscht", Toast.LENGTH_SHORT).show();
              }

              // ---------- PIN-Sperre ----------

              private String hash(String pin, byte[] salt) {
                  try {
                      SecretKeyFactory f = SecretKeyFactory.getInstance("PBKDF2WithHmacSHA1");
                      byte[] h = f.generateSecret(new PBEKeySpec(pin.toCharArray(), salt, 50000, 160)).getEncoded();
                      return Base64.encodeToString(h, Base64.NO_WRAP);
                  } catch (Exception e) {
                      return "";
                  }
              }

              private void showLock() {
                  locked = true;
                  mainView.setVisibility(View.GONE);
                  lockView.setVisibility(View.VISIBLE);
                  lockTitle.setText(prefs.contains("h") ? "ENTSPERREN" : "NEUE PIN FESTLEGEN (MIN. 4 ZIFFERN)");
                  String crash = prefs.getString("crash", null);
                  if (crash != null) {
                      lockTitle.setText(lockTitle.getText() + "\n\nLETZTER ABSTURZ:\n" + crash);
                      lockTitle.setTextSize(9);
                      prefs.edit().remove("crash").apply();
                  }
                  pinField.setText("");
              }

              private void unlock() {
                  locked = false;
                  lockView.setVisibility(View.GONE);
                  mainView.setVisibility(View.VISIBLE);
                  home();
              }

              private void onPinSubmit() {
                  String p = pinField.getText().toString();
                  pinField.setText("");
                  if (p.length() < 4) {
                      Toast.makeText(this, "Mindestens 4 Ziffern", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  if (!prefs.contains("h")) {
                      byte[] salt = new byte[16];
                      new SecureRandom().nextBytes(salt);
                      prefs.edit()
                              .putString("salt", Base64.encodeToString(salt, Base64.NO_WRAP))
                              .putString("h", hash(p, salt))
                              .apply();
                      unlock();
                      return;
                  }
                  if (System.currentTimeMillis() < lockedUntil) {
                      Toast.makeText(this, "Zu viele Versuche - kurz warten", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  byte[] salt = Base64.decode(prefs.getString("salt", ""), Base64.NO_WRAP);
                  String expected = prefs.getString("h", "");
                  if (MessageDigest.isEqual(hash(p, salt).getBytes(), expected.getBytes())) {
                      fails = 0;
                      unlock();
                  } else {
                      fails++;
                      if (fails >= 5) {
                          lockedUntil = System.currentTimeMillis() + 30000;
                          fails = 0;
                      }
                      Toast.makeText(this, "Falsche PIN", Toast.LENGTH_SHORT).show();
                  }
              }

              // ---------- Lebenszyklus ----------

              @Override
              protected void onPause() {
                  super.onPause();
                  if (!locked) {
                      wipe();
                      web.loadUrl("about:blank");
                      showLock();
                  }
              }

              @Override
              protected void onDestroy() {
                  try { if (torConn != null) unbindService(torConn); } catch (Exception e) { }
                  wipe();
                  web.destroy();
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (!locked && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: APK bauen
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Ghost-apk
          path: app/build/outputs/apk/release/app-release.apk
