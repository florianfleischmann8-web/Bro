name: Build GHOST Browser APK (einfach)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signierschluessel erzeugen
        run: |
          keytool -genkeypair -v -keystore release.jks -alias k \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ghostbrowser -keypass ghostbrowser \
            -dname "CN=Rechner"

      - name: Projekt erzeugen
        run: |
          mkdir -p app/src/main/java/com/example/privbrowser
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Ghost"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.privbrowser'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.privbrowser'
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName '4.0'
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file('release.jks')
                      storePassword 'ghostbrowser'
                      keyAlias 'k'
                      keyPassword 'ghostbrowser'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp" android:height="96dp"
              android:viewportWidth="96" android:viewportHeight="96">
              <path android:fillColor="#3A3F47"
                  android:pathData="M16,8h64a8,8 0 0 1 8,8v64a8,8 0 0 1 -8,8H16a8,8 0 0 1 -8,-8V16a8,8 0 0 1 8,-8z"/>
              <path android:fillColor="#9FD3C7" android:pathData="M20,20h56v16H20z"/>
              <path android:fillColor="#E6E6E6"
                  android:pathData="M20,46h11v8h-11z M35,46h11v8h-11z M50,46h11v8h-11z M65,46h11v8h-11z M20,58h11v8h-11z M35,58h11v8h-11z M50,58h11v8h-11z M65,58h11v8h-11z M20,70h11v8h-11z M35,70h11v8h-11z M50,70h11v8h-11z M65,70h11v8h-11z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Rechner"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/assets/start.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          *{box-sizing:border-box}
          html,body{margin:0;height:100%;background:#07070D;color:#E8E8F5;font-family:sans-serif}
          body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
               background:radial-gradient(circle at 50% 0%,#241050 0%,#07070D 62%)}
          h1{font-size:46px;letter-spacing:12px;margin:0 0 6px 12px;color:#00F0FF;
             text-shadow:0 0 10px #00F0FF,0 0 34px #7a2cff}
          p.s{color:#6B6B85;margin:0 0 38px;font-size:12px;letter-spacing:3px}
          form{width:100%;max-width:420px;padding:2px;border-radius:30px;
               background:linear-gradient(90deg,#00F0FF,#FF2BD6,#00F0FF);background-size:200% 100%;
               animation:m 4s linear infinite;box-shadow:0 0 24px rgba(0,240,255,.25)}
          @keyframes m{to{background-position:200% 0}}
          input{width:100%;border:0;outline:0;border-radius:28px;background:#0E0E18;color:#fff;
                padding:16px 22px;font-size:16px}
          .f{margin-top:42px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
          .f span{border:1px solid #2a2a40;border-radius:20px;padding:6px 12px;font-size:12px;color:#9a9ac0}
          </style></head><body>
          <h1>GHOST</h1>
          <p class="s">PRIVAT &middot; SPURLOS</p>
          <form action="https://duckduckgo.com/" method="get" autocomplete="off">
            <input type="text" name="q" placeholder="Suchen &hellip;" autocomplete="off" autocapitalize="off" spellcheck="false">
          </form>
          <div class="f"><span>Kein Verlauf</span><span>HTTPS-only</span><span>Kein WebRTC</span><span>Kein Tracking</span></div>
          </body></html>
          EOF

          cat > app/src/main/assets/harden.js <<'EOF'
          (function(){
            function def(o,p,v){try{Object.defineProperty(o,p,{get:function(){return v},configurable:true});}catch(e){}}
            ['RTCPeerConnection','webkitRTCPeerConnection','RTCDataChannel','RTCIceCandidate','RTCSessionDescription'].forEach(function(n){
              try{delete window[n];}catch(e){}
              def(window,n,undefined);
            });
            def(navigator,'getBattery',undefined);
            def(navigator,'connection',undefined);
            def(navigator,'hardwareConcurrency',4);
            def(navigator,'deviceMemory',4);
            def(navigator,'doNotTrack','1');
          })();
          EOF

          cat > app/src/main/java/com/example/privbrowser/MainActivity.java <<'EOF'
          package com.example.privbrowser;

          import android.app.Activity;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.inputmethod.EditorInfo;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.URLEncoder;
          import java.util.Collections;

          public class MainActivity extends Activity {

              static final int BG = Color.parseColor("#07070D");
              static final int SURFACE = Color.parseColor("#12121C");
              static final int FIELD = Color.parseColor("#0E0E18");
              static final int CYAN = Color.parseColor("#00F0FF");
              static final int MAGENTA = Color.parseColor("#FF2BD6");
              static final int TEXT = Color.parseColor("#E8E8F5");
              static final int MUTED = Color.parseColor("#6B6B85");
              static final String SEARCH = "https://duckduckgo.com/";
              static final int IME_NO_PERSONALIZED_LEARNING = 0x01000000;

              private WebView web;
              private EditText bar;
              private ProgressBar pb;
              private boolean clearAfter = false;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  buildUi();
                  setupWebView();
                  home();
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable pill(int fill, int stroke, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(fill);
                  g.setCornerRadius(dp(radiusDp));
                  if (stroke != 0) g.setStroke(dp(1), stroke);
                  return g;
              }

              private TextView navBtn(String t, View.OnClickListener l) {
                  TextView v = new TextView(this);
                  v.setText(t);
                  v.setTextSize(22);
                  v.setTextColor(CYAN);
                  v.setGravity(Gravity.CENTER);
                  v.setOnClickListener(l);
                  v.setLayoutParams(new LinearLayout.LayoutParams(0, dp(52), 1f));
                  return v;
              }

              private void buildUi() {
                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.VERTICAL);
                  main.setBackgroundColor(BG);

                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setBackgroundColor(SURFACE);
                  top.setPadding(dp(12), dp(8), dp(12), dp(8));

                  TextView brand = new TextView(this);
                  brand.setText("\u25C8");
                  brand.setTextSize(22);
                  brand.setTextColor(MAGENTA);
                  brand.setPadding(0, 0, dp(10), 0);
                  top.addView(brand);

                  bar = new EditText(this);
                  bar.setHint("Suchen oder Adresse eingeben");
                  bar.setHintTextColor(MUTED);
                  bar.setTextColor(TEXT);
                  bar.setTextSize(15);
                  bar.setSingleLine(true);
                  bar.setBackground(pill(FIELD, Color.parseColor("#3300F0FF"), 22));
                  bar.setPadding(dp(16), dp(10), dp(16), dp(10));
                  bar.setSelectAllOnFocus(true);
                  bar.setImeOptions(EditorInfo.IME_ACTION_GO | IME_NO_PERSONALIZED_LEARNING);
                  bar.setInputType(InputType.TYPE_CLASS_TEXT
                          | InputType.TYPE_TEXT_VARIATION_URI
                          | InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS);
                  bar.setOnEditorActionListener((v, id, e) -> {
                      go(bar.getText().toString().trim());
                      return true;
                  });
                  top.addView(bar, new LinearLayout.LayoutParams(0, -2, 1f));
                  main.addView(top, new LinearLayout.LayoutParams(-1, -2));

                  pb = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  pb.setMax(100);
                  pb.setProgressTintList(ColorStateList.valueOf(CYAN));
                  pb.setProgressBackgroundTintList(ColorStateList.valueOf(SURFACE));
                  pb.setVisibility(View.INVISIBLE);
                  main.addView(pb, new LinearLayout.LayoutParams(-1, dp(3)));

                  web = new WebView(this);
                  web.setBackgroundColor(BG);
                  main.addView(web, new LinearLayout.LayoutParams(-1, 0, 1f));

                  LinearLayout nav = new LinearLayout(this);
                  nav.setOrientation(LinearLayout.HORIZONTAL);
                  nav.setBackgroundColor(SURFACE);
                  nav.addView(navBtn("\u2039", v -> { if (web.canGoBack()) web.goBack(); }));
                  nav.addView(navBtn("\u203A", v -> { if (web.canGoForward()) web.goForward(); }));
                  nav.addView(navBtn("\u27F3", v -> web.reload()));
                  nav.addView(navBtn("\u2302", v -> home()));
                  nav.addView(navBtn("\uD83D\uDD25", v -> {
                      wipe();
                      home();
                      Toast.makeText(this, "Alles gelöscht", Toast.LENGTH_SHORT).show();
                  }));
                  main.addView(nav, new LinearLayout.LayoutParams(-1, -2));

                  setContentView(main);
              }

              private void setupWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  s.setSaveFormData(false);
                  s.setGeolocationEnabled(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setSupportMultipleWindows(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  if (Build.VERSION.SDK_INT >= 26) {
                      s.setSafeBrowsingEnabled(false);
                  }
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, false);

                  final String hardenJs = asset("harden.js");
                  final boolean docStart = WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT);
                  if (docStart) {
                      WebViewCompat.addDocumentStartJavaScript(web, hardenJs, Collections.singleton("*"));
                  }

                  web.setDownloadListener((url, a, c, m, l) ->
                          Toast.makeText(this, "Downloads sind blockiert", Toast.LENGTH_SHORT).show());

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView v, int p) {
                          pb.setProgress(p);
                          pb.setVisibility(p >= 100 ? View.INVISIBLE : View.VISIBLE);
                      }
                      @Override public void onPermissionRequest(PermissionRequest r) { r.deny(); }
                      @Override public void onGeolocationPermissionsShowPrompt(String o,
                              GeolocationPermissions.Callback cb) { cb.invoke(o, false, false); }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView v, String u, android.graphics.Bitmap f) {
                          if (!docStart) v.evaluateJavascript(hardenJs, null);
                      }
                      @Override
                      public void onPageFinished(WebView v, String u) {
                          if (clearAfter) { v.clearHistory(); clearAfter = false; }
                          if (u == null || u.startsWith("about:") || u.startsWith("data:")) bar.setText("");
                          else if (!bar.hasFocus()) bar.setText(u);
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String sch = u.getScheme();
                          if ("https".equals(sch) || "about".equals(sch) || "data".equals(sch)) return false;
                          if ("http".equals(sch)) {
                              v.loadUrl(u.buildUpon().scheme("https").build().toString());
                          }
                          return true;
                      }
                  });
              }

              private String asset(String name) {
                  try (InputStream in = getAssets().open(name)) {
                      ByteArrayOutputStream o = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int r;
                      while ((r = in.read(buf)) > 0) o.write(buf, 0, r);
                      return o.toString("UTF-8");
                  } catch (Exception e) {
                      return "";
                  }
              }

              private void home() {
                  clearAfter = true;
                  web.loadDataWithBaseURL("about:blank", asset("start.html"),
                          "text/html", "utf-8", null);
              }

              private void go(String in) {
                  if (in.isEmpty()) return;
                  String url;
                  if (in.matches("(?i)^https?://\\S+$")) {
                      url = in;
                  } else if (in.matches("(?i)^[^\\s/]+\\.[^\\s/]+(/\\S*)?$")) {
                      url = "https://" + in;
                  } else {
                      try {
                          url = SEARCH + "?q=" + URLEncoder.encode(in, "UTF-8");
                      } catch (Exception e) {
                          return;
                      }
                  }
                  if (url.toLowerCase().startsWith("http://")) url = "https://" + url.substring(7);
                  bar.clearFocus();
                  web.loadUrl(url);
              }

              private void wipe() {
                  CookieManager.getInstance().removeAllCookies(null);
                  CookieManager.getInstance().flush();
                  WebStorage.getInstance().deleteAllData();
                  web.clearCache(true);
                  web.clearHistory();
                  web.clearFormData();
              }

              @Override
              protected void onDestroy() {
                  wipe();
                  web.destroy();
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: APK bauen
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Ghost-apk
          path: app/build/outputs/apk/release/app-release.apk
