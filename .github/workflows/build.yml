name: Build GHOST Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signierschluessel erzeugen
        run: |
          keytool -genkeypair -v -keystore release.jks -alias k \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass ghostbrowser -keypass ghostbrowser \
            -dname "CN=Rechner"

      - name: Projekt erzeugen
        run: |
          mkdir -p app/src/main/java/com/example/privbrowser
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://raw.githubusercontent.com/guardianproject/gpmaven/master" }
              }
          }
          rootProject.name = "Ghost"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.privbrowser'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.privbrowser'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '3.0'
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }
              packagingOptions {
                  jniLibs { useLegacyPackaging = true }
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file('release.jks')
                      storePassword 'ghostbrowser'
                      keyAlias 'k'
                      keyPassword 'ghostbrowser'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources false
                      debuggable false
                      signingConfig signingConfigs.release
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
              implementation 'info.guardianproject:tor-android:0.4.8.11'
              implementation 'info.guardianproject:jtorctl:0.4.5.7'
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          -dontwarn **
          -keep class org.torproject.** { *; }
          -keep class net.freehaven.** { *; }
          -keep class info.guardianproject.** { *; }
          EOF

          # Neutrales Tarn-Icon (Taschenrechner)
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp" android:height="96dp"
